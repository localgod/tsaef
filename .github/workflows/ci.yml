name: 🔨 CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Format, lint and type-check
        run: vp check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build and test
        run: |
          npm run build
          vp test
